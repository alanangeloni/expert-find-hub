    <meta name="description" content="Match with vetted, fee-only fiduciary financial advisors based on your goals, assets, and stage of life. Free to search, free to get matched." />
    <link rel="canonical" href="https://financialprofessional.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Find a Financial Professional | Fiduciary Advisors" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Find a Financial Professional | Fiduciary Advisors" />
    <meta name="twitter:description" content="Match with vetted, fee-only fiduciary financial advisors based on your goals, assets, and stage of life. Free to search, free to get matched." />

    <meta name="robots" content="index, follow" />

    <!-- Organization + WebSite structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Financial Professional",
            "url": "https://financialprofessional.com/",
            "logo": "https://financialprofessional.com/lovable-uploads/23da7e4b-4b23-462c-904f-a7e4a7531958.png",
            "description": "Directory that matches people with vetted fiduciary financial advisors, investment firms and accounting firms."
          },
          {
            "@type": "WebSite",
            "name": "Financial Professional",
            "url": "https://financialprofessional.com/",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://financialprofessional.com/advisors?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
